<!DOCTYPE html>
<html lang="pt-br" data-protegida>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas | Dog Dodói</title>
    <link rel="icon" href="../img/marca.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../styles/design/tokens.css">
    <link rel="stylesheet" href="../styles/design/base.css">
    <link rel="stylesheet" href="../styles/design/components.css">
    <link rel="stylesheet" href="../styles/design/admin.css">
    <script src="../js/storage.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/icones.js" defer></script>
    <script src="../js/layout.js" defer></script>
    <script src="../js/listaConsultas.js" defer></script>
</head>
<body class="app" data-secao="consultas">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <aside class="app-lateral" id="menu-lateral"></aside>

    <div class="app-principal">
        <header class="app-topo">
            <button type="button" class="botao botao-secundario botao-pequeno app-menu-botao" data-abrir-menu
                    aria-controls="menu-lateral" aria-expanded="false" data-icone="menu">Menu</button>
            <nav class="trilha" aria-label="Você está em">
                <ol><li><a href="dashBoard.html">Painel</a></li><li><span aria-current="page">Consultas</span></li></ol>
            </nav>
            <a class="botao botao-fantasma botao-pequeno" href="index.html" data-icone="site">Ver site</a>
        </header>

        <main class="app-conteudo" id="conteudo">
            <div class="pagina-cabecalho">
                <div>
                    <p class="contexto">Atendimento</p>
                    <h1>Consultas</h1>
                    <p class="descricao">Agenda da clínica, do próximo horário ao histórico.</p>
                </div>
                <div class="pagina-acoes">
                    <a class="botao botao-primario" href="consultas.html" data-icone="mais">Agendar consulta</a>
                </div>
            </div>

            <section class="painel">
                <div class="barra-ferramentas">
                    <fieldset class="filtros" id="filtro">
                        <legend class="oculto">Mostrar consultas</legend>
                        <label class="filtro"><input type="radio" name="filtro" value="agendadas" checked><span>Próximas</span></label>
                        <label class="filtro"><input type="radio" name="filtro" value="realizadas"><span>Realizadas</span></label>
                        <label class="filtro"><input type="radio" name="filtro" value="canceladas"><span>Canceladas</span></label>
                        <label class="filtro"><input type="radio" name="filtro" value="todas"><span>Todas</span></label>
                    </fieldset>
                    <p class="resumo" id="resumo" aria-live="polite"></p>
                </div>
                <table class="tabela">
                    <thead>
                        <tr><th scope="col">Data e hora</th><th scope="col">Cliente</th><th scope="col">Observações</th><th scope="col">Situação</th><th scope="col"><span class="oculto">Ações</span></th></tr>
                    </thead>
                    <tbody id="consultas"></tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
