<!DOCTYPE html>
<html lang="pt-br" data-protegida>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de clientes | Dog Dodói</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="../styles/Cliente.css">
    <link rel="stylesheet" href="../styles/componentes.css">
    <script src="../js/storage.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/mascaras.js"></script>
    <script src="../js/cliente.js" defer></script>
</head>
<body>
    <header>
        <figure>
            <a href="dashBoard.html"><img src="../img/logo.png" alt="Dog Dodói - voltar ao painel"></a>
        </figure>
        <nav>
            <a href="index.html" data-sair>Sair</a>
        </nav>
    </header>

    <main>
        <form id="form-cliente">

        <h1 id="titulo">Cadastro de clientes</h1>

        <section class="pri">
            <div class="arr">
                <div class="nome">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="email">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
            <div class="arr">
                <div class="cpf">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" required inputmode="numeric"
                           data-mascara="cpf" placeholder="000.000.000-00">
                </div>

                <div class="zapp">
                    <label for="whatsapp">WhatsApp</label>
                    <input type="tel" id="whatsapp" name="whatsapp" required minlength="14"
                           data-mascara="telefone" placeholder="(18) 99123-1234">
                </div>

                <div class="outro">
                    <label for="outro-contato">Outro contato (opcional)</label>
                    <input type="tel" id="outro-contato" name="outroContato" minlength="14"
                           data-mascara="telefone">
                </div>

                <div class="data">
                    <label for="nascimento">Data de nascimento</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>
            </div>
        </section>

        <h2 class="p2">Endereço</h2>

        <section class="seg">
            <div class="arr">
            <div class="cep">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" required inputmode="numeric" pattern="\d{5}-\d{3}"
                       title="CEP no formato 00000-000" data-mascara="cep" placeholder="00000-000">
            </div>

            <div class="cid">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" required>
            </div>

            <div class="uf">
                <label for="uf">UF</label>
                <input type="text" id="uf" name="uf" required maxlength="2" pattern="[A-Za-z]{2}" title="Sigla do estado, ex.: SP">
            </div>
            </div>
            <div class="arr">
            <div class="rua">
                <label for="rua">Rua</label>
                <input type="text" id="rua" name="rua" required>
            </div>

            <div class="numero">
                <label for="numero">Número</label>
                <input type="text" id="numero" name="numero" required>
            </div>

            <div class="bairro">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" required>
            </div>
            </div>
        </section>

        <section class="but">

                <div class="verde">
                    <button type="submit">Salvar</button>
                </div>

                <div class="vermelho">
                    <button type="button" id="cancelar">Cancelar</button>
                </div>

        </section>

        </form>
    </main>
</body>
</html>
