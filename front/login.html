<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Dog Dodói</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="../styles/Login.css">
    <link rel="stylesheet" href="../styles/componentes.css">
    <script src="../js/storage.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/login.js" defer></script>
</head>
<body>
    <header>
        <figure>
            <a href="index.html"><img src="../img/logo.png" alt="Dog Dodói - página inicial"></a>
        </figure>
        <nav>
            <a href="index.html">Voltar</a>
        </nav>
    </header>
    <main>
        <h1 id="titulo">Entrar</h1>

        <div>
            <form id="form-login">
                <div class="escrever">
                    <label for="login">E-mail ou usuário:</label>
                    <input type="text" id="login" name="login" required autocomplete="username">
                </div>

                <div class="escrever">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required autocomplete="current-password">
                </div>

                <div>
                    <button type="submit">Entrar</button>
                </div>

                <div>
                    <nav>
                        <a href="Register.html">Ainda não tem cadastro? Cadastre-se</a>
                    </nav>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
