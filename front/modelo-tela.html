<!DOCTYPE html>
<!--
    Modelo para uma tela nova do painel.
    1. Copie este arquivo e troque título, trilha e conteúdo.
    2. Escolha a seção do menu em <body data-secao="..."> (painel, clientes, consultas, usuarios)
       ou crie um item novo em MENU, no js/layout.js.
    3. Use os componentes de styles/design/components.css (veja front/guia-visual.html).
    4. Crie um js/<nomeDaTela>.js e inclua-o no fim do <head> com defer.
-->
<html lang="pt-br" data-protegida>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova tela | Dog Dodói</title>
    <link rel="icon" href="../img/marca.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../styles/design/tokens.css">
    <link rel="stylesheet" href="../styles/design/base.css">
    <link rel="stylesheet" href="../styles/design/components.css">
    <link rel="stylesheet" href="../styles/design/admin.css">
    <script src="../js/storage.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/icones.js" defer></script>
    <script src="../js/layout.js" defer></script>
</head>
<body class="app" data-secao="painel">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <aside class="app-lateral" id="menu-lateral"></aside>

    <div class="app-principal">
        <header class="app-topo">
            <button type="button" class="botao botao-secundario botao-pequeno app-menu-botao" data-abrir-menu
                    aria-controls="menu-lateral" aria-expanded="false" data-icone="menu">Menu</button>
            <nav class="trilha" aria-label="Você está em">
                <ol><li><a href="dashBoard.html">Painel</a></li><li><span aria-current="page">Nova tela</span></li></ol>
            </nav>
            <a class="botao botao-fantasma botao-pequeno" href="index.html" data-icone="site">Ver site</a>
        </header>

        <main class="app-conteudo" id="conteudo">
            <div class="pagina-cabecalho">
                <div>
                    <p class="contexto">Seção</p>
                    <h1>Título da tela</h1>
                    <p class="descricao">Uma frase explicando para que serve esta tela.</p>
                </div>
                <div class="pagina-acoes">
                    <a class="botao botao-primario" href="#" data-icone="mais">Ação principal</a>
                </div>
            </div>

            <section class="painel">
                <div class="painel-cabecalho"><h2>Conteúdo</h2></div>
                <div class="painel-corpo">
                    <p class="texto-suave">Coloque aqui tabelas, formulários ou indicadores.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
