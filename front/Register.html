<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Dog Dodói</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="../styles/Register.css">
    <link rel="stylesheet" href="../styles/componentes.css">
    <script src="../js/storage.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/registro.js" defer></script>
</head>
<body>
    <header>
        <figure>
            <a href="index.html" id="link-logo"><img src="../img/logo.png" alt="Dog Dodói - página inicial"></a>
        </figure>
    </header>
    <main>
        <h1 id="titulo">Criar conta</h1>

        <div>
            <form id="form-registro">
                <div class="escrever">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required autocomplete="name">
                </div>

                <div class="escrever">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="escrever">
                    <label for="usuario">Nome de usuário:</label>
                    <input type="text" id="usuario" name="usuario" required autocomplete="username"
                           pattern="[A-Za-z0-9._\-]{3,}" title="Pelo menos 3 caracteres: letras, números, ponto, hífen ou sublinhado.">
                </div>

                <div class="escrever">
                    <label for="senha">Criar senha:</label>
                    <input type="password" id="senha" name="senha" required minlength="6" autocomplete="new-password">
                </div>

                <div class="escrever">
                    <label for="confirmar-senha">Confirmar senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmarSenha" required autocomplete="new-password">
                </div>

                <div>
                    <button type="submit">Criar conta</button>
                </div>

                <div>
                    <nav id="link-rodape">
                        <a href="login.html">Já tenho cadastro</a>
                    </nav>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
